# Gazebo and ROS speak different message formats, so every topic that has to
# cross between them is listed here. Everything is one way, out of Gazebo.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/image"
  gz_topic_name: "/wrist_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/depth_image"
  gz_topic_name: "/wrist_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/camera_info"
  gz_topic_name: "/wrist_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# A contact sensor ignores the <topic> given in the model and always publishes
# under its own full path, so those paths are what have to be named here. Both
# fingers report onto the one ROS topic: the task only asks whether the
# fingertip is touching something, not which side of it.
- ros_topic_name: "/fingertip_contacts"
  gz_topic_name: "/world/work_cell/model/work_cell/link/left_finger/sensor/left_fingertip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "/fingertip_contacts"
  gz_topic_name: "/world/work_cell/model/work_cell/link/right_finger/sensor/right_fingertip_contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
