[workspace]
name = "touch-cuboid-centers"
version = "0.1.0"
description = "A UR5e in Gazebo finds the largest face of each cuboid on a table and touches its centre"
authors = ["Robin Nagpal <robinnagpal.tiet@gmail.com>"]
# conda-forge first, RoboStack second: RoboStack only supplies the ros-* packages
# and expects the rest of the stack to resolve from conda-forge.
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# ROS 2 Jazzy Jalisco (LTS, supported to May 2029) is built against CPython 3.12
# on RoboStack — that pin is what rclpy's compiled extensions link against, so it
# is not a free choice.
python = "3.12.*"
ros-jazzy-desktop = "*"

# Simulation: Gazebo Harmonic plus the ROS <-> Gazebo bridge and the
# ros2_control system plugin that drives the arm inside the simulator.
ros-jazzy-ros-gz = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"

# The arm: Universal Robots' own URDF/xacro description and controller configs.
ros-jazzy-ur-description = "*"

# Motion planning.
ros-jazzy-moveit = "*"
ros-jazzy-moveit-py = "*"

# Perception: OpenCV, and the bridge that turns sensor_msgs/Image into ndarrays.
ros-jazzy-cv-bridge = "*"
py-opencv = ">=4.9"
numpy = ">=1.26,<3"

# Build tooling for the colcon workspace under src/.
colcon-common-extensions = "*"
# setuptools 80 removed the `develop` command that ament_python packages rely on
# for `colcon build --symlink-install`; newer than that breaks editable builds.
setuptools = ">=68,<80"
# ROS 2 Jazzy ships a `launch_testing` pytest plugin whose hooks use the `path`
# argument pytest 8 removed, so anything >=8 fails at plugin-load time.
pytest = ">=7,<8"
pip = "*"
ruff = "*"

[tasks]
# The Makefile is the entry point for people; these are the primitives it builds
# on. Anything workflow-specific lives in the Makefile, not here.
build = "colcon build --symlink-install"
clean = "rm -rf build install log"
