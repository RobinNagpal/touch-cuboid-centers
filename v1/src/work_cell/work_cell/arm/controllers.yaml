# The controllers ros2_control loads inside Gazebo.
#
# Both moving groups use the same trajectory controller: it takes a list of
# joint positions with times against them and interpolates between them, which
# is exactly what MoveIt produces.

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Closing on a cuboid always stops the fingers short of the position they
    # were asked for. That is the grip, not a fault, so no tolerance is set on
    # where the fingers end up.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
