# KDL is MoveIt's general numerical IK solver. The UR5e is a well behaved
# 6-axis arm, so it does not need an arm-specific solver, but it does need
# more than the default 5 ms when it is asked for poses close to the edge of
# the reachable space.
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 5
